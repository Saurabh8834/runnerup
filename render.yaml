services:
  - type: web
    name: runnerup-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://runnerup.in,https://www.runnerup.in
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Runner Up <team@runnerup.in>
      - key: RESEND_REPLY_TO
        value: runnerupofficials@gmail.com
      - key: CERTIFICATE_AUTO_SEND
        value: "true"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: sourav06556@gmail.com,realblack009@gmail.com
      - key: ADMIN_EMERGENCY_KEY
        value: "RunnerUp@Admin2026!#"
      - key: ADMIN_BOOTSTRAP
        value: "false"
