<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="medalBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Lanyard Ribbon Gradients -->
    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="ribbonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <linearGradient id="ribbonAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Hologram Seal -->
    <linearGradient id="holoSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter for 3D Medal -->
    <filter id="medalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="800" height="600" fill="url(#medalBg)" />

  <!-- Ambient Light Spotlight -->
  <circle cx="400" cy="330" r="280" fill="#f59e0b" opacity="0.12" filter="url(#goldGlow)" />
  <circle cx="400" cy="330" r="180" fill="#38bdf8" opacity="0.08" filter="url(#goldGlow)" />

  <!-- Background Tech Geometry Circles -->
  <g opacity="0.25" stroke="#94a3b8" stroke-width="1" fill="none">
    <circle cx="400" cy="330" r="240" stroke-dasharray="6 8" />
    <circle cx="400" cy="330" r="260" stroke-dasharray="2 12" />
    <circle cx="400" cy="330" r="280" />
    <!-- Crosshairs -->
    <line x1="400" y1="50" x2="400" y2="100" stroke="#f59e0b" stroke-width="2" />
    <line x1="400" y1="560" x2="400" y2="600" stroke="#f59e0b" stroke-width="2" />
    <line x1="120" y1="330" x2="160" y2="330" stroke="#10b981" stroke-width="2" />
    <line x1="640" y1="330" x2="680" y2="330" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- LANYARD / RIBBON (V-Hang From Top) -->
  <g filter="url(#medalShadow)">
    <!-- Left Ribbon Strap -->
    <polygon points="320,0 260,0 365,220 400,210" fill="url(#ribbonLeft)" />
    <polygon points="290,0 280,0 375,215 385,213" fill="url(#ribbonAccent)" />
    <!-- Repeated texture on strap -->
    <g opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6">
      <line x1="305" y1="0" x2="382" y2="215" />
    </g>

    <!-- Right Ribbon Strap -->
    <polygon points="480,0 540,0 435,220 400,210" fill="url(#ribbonRight)" />
    <polygon points="510,0 520,0 425,215 415,213" fill="url(#ribbonAccent)" />
    <g opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6">
      <line x1="495" y1="0" x2="418" y2="215" />
    </g>

    <!-- Ribbon Clamp / Loop Ring -->
    <rect x="375" y="195" width="50" height="24" rx="6" fill="url(#goldRim)" stroke="#78350f" stroke-width="2" />
    <circle cx="400" cy="207" r="5" fill="#1e293b" />
  </g>

  <!-- MEDAL BODY (Outer Shield / Sunburst Gear) -->
  <g filter="url(#medalShadow)">
    <!-- Outer Octagonal / Scalloped Starbase -->
    <g transform="translate(400, 350)">
      <!-- Outer Glow Ring -->
      <circle cx="0" cy="0" r="160" fill="url(#goldRim)" stroke="#78350f" stroke-width="4" />
      
      <!-- 24 Beveled Star Cog Teeth -->
      <g stroke="#92400e" stroke-width="1.5" fill="url(#goldBevel)">
        <polygon points="0,-165 -15,-155 15,-155" />
        <polygon points="0,165 -15,155 15,155" />
        <polygon points="-165,0 -155,-15 -155,15" />
        <polygon points="165,0 155,-15 155,15" />
        
        <polygon points="-117,-117 -125,-100 -100,-125" />
        <polygon points="117,-117 125,-100 100,-125" />
        <polygon points="-117,117 -125,100 -100,125" />
        <polygon points="117,117 125,100 100,125" />
      </g>

      <!-- Outer Rim Ring Step -->
      <circle cx="0" cy="0" r="148" fill="#1e293b" stroke="url(#goldRim)" stroke-width="6" />
      
      <!-- Laurel Wreath Around Rim -->
      <g fill="url(#goldBevel)" opacity="0.9">
        <!-- Left Laurel Leaves -->
        <path d="M -130,-30 C -140,-10 -138,40 -100,90" fill="none" stroke="url(#goldRim)" stroke-width="3" />
        <ellipse cx="-132" cy="-20" rx="8" ry="4" transform="rotate(-30, -132, -20)" />
        <ellipse cx="-136" cy="10" rx="8" ry="4" transform="rotate(-10, -136, 10)" />
        <ellipse cx="-130" cy="40" rx="8" ry="4" transform="rotate(15, -130, 40)" />
        <ellipse cx="-115" cy="70" rx="8" ry="4" transform="rotate(40, -115, 70)" />
        <ellipse cx="-90" cy="95" rx="8" ry="4" transform="rotate(65, -90, 95)" />

        <!-- Right Laurel Leaves -->
        <path d="M 130,-30 C 140,-10 138,40 100,90" fill="none" stroke="url(#goldRim)" stroke-width="3" />
        <ellipse cx="132" cy="-20" rx="8" ry="4" transform="rotate(30, 132, -20)" />
        <ellipse cx="136" cy="10" rx="8" ry="4" transform="rotate(10, 136, 10)" />
        <ellipse cx="130" cy="40" rx="8" ry="4" transform="rotate(-15, 130, 40)" />
        <ellipse cx="115" cy="70" rx="8" ry="4" transform="rotate(-40, 115, 70)" />
        <ellipse cx="90" cy="95" rx="8" ry="4" transform="rotate(-65, 90, 95)" />
      </g>

      <!-- Inner Recessed Medal Face -->
      <circle cx="0" cy="0" r="120" fill="url(#goldInner)" stroke="url(#goldRim)" stroke-width="5" />
      
      <!-- Radial Sunray Texture on Face -->
      <g stroke="#fde047" stroke-width="1" opacity="0.35">
        <line x1="0" y1="-120" x2="0" y2="120" />
        <line x1="-120" y1="0" x2="120" y2="0" />
        <line x1="-85" y1="-85" x2="85" y2="85" />
        <line x1="85" y1="-85" x2="-85" y2="85" />
      </g>

      <!-- Embossed Mountain Logo Emblem Inside Medal -->
      <!-- Back Peak -->
      <polygon points="0,-65 -45,15 45,15" fill="#78350f" stroke="#fef08a" stroke-width="2" />
      <polygon points="0,-65 0,15 45,15" fill="#92400e" />
      <!-- Snow Cap on Peak -->
      <polygon points="0,-65 -15,-35 -5,-30 0,-40 6,-32 15,-35" fill="#ffffff" />

      <!-- Left Sub-Peak -->
      <polygon points="-35,-35 -70,25 0,25" fill="#92400e" stroke="#fef08a" stroke-width="1.5" />
      <polygon points="-35,-35 -18,-15 -25,-10 -35,-20" fill="#ffffff" />

      <!-- Right Sub-Peak -->
      <polygon points="35,-35 0,25 70,25" fill="#78350f" stroke="#fef08a" stroke-width="1.5" />
      <polygon points="35,-35 48,-15 42,-10 35,-20" fill="#ffffff" />

      <!-- Runner Figure on Trail Inside Medal -->
      <g transform="translate(0, 15) scale(0.65)">
        <circle cx="0" cy="-25" r="4.5" fill="#ffffff" />
        <path d="M 0,-20 L 0,-2 L -8,15 M 0,-2 L 8,15 M -8,-12 L 8,-12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Embossed Text Curved Along Banner -->
      <rect x="-80" y="38" width="160" height="24" rx="12" fill="#0f172a" stroke="url(#goldRim)" stroke-width="2" />
      <text x="0" y="54" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">FINISHER 2026</text>

      <text x="0" y="-85" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="3">RUNNERUP</text>

      <!-- 5 Stars Below -->
      <g transform="translate(-36, 75)" fill="#fef08a">
        <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3.5,4.5 0,2.5 -3.5,4.5 -2,1 -5,-1.5 -1.5,-1.5" />
        <g transform="translate(18, 0)">
          <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3.5,4.5 0,2.5 -3.5,4.5 -2,1 -5,-1.5 -1.5,-1.5" />
        </g>
        <g transform="translate(36, 0)">
          <polygon points="0,-6 2,-2 6.5,-2 2.5,1.5 4,6 0,3.5 -4,6 -2.5,1.5 -6.5,-2 -2,-2" fill="#ffffff" />
        </g>
        <g transform="translate(54, 0)">
          <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3.5,4.5 0,2.5 -3.5,4.5 -2,1 -5,-1.5 -1.5,-1.5" />
        </g>
        <g transform="translate(72, 0)">
          <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3.5,4.5 0,2.5 -3.5,4.5 -2,1 -5,-1.5 -1.5,-1.5" />
        </g>
      </g>
    </g>
  </g>

  <!-- Sparkles & Specular Glints -->
  <g filter="url(#sparkleGlow)">
    <!-- Top-Left Glint on Rim -->
    <g transform="translate(295, 245)">
      <polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <!-- Bottom-Right Glint -->
    <g transform="translate(515, 435)">
      <polygon points="0,-12 2.5,-2.5 12,0 2.5,2.5 0,12 -2.5,2.5 -12,0 -2.5,-2.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#fef08a" />
    </g>
    <!-- Center Peak Glint -->
    <g transform="translate(400, 285)">
      <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff" />
    </g>
  </g>

  <!-- Holographic Verified Authenticity Badge Floating Bottom Left -->
  <g transform="translate(80, 480)" filter="url(#medalShadow)">
    <rect width="180" height="64" rx="16" fill="#0f172a" stroke="url(#holoSeal)" stroke-width="1.8" />
    <circle cx="34" cy="32" r="18" fill="url(#holoSeal)" opacity="0.2" />
    <path d="M 26,32 L 32,38 L 42,26" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="62" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">OFFICIAL REWARD</text>
    <text x="62" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">GPS Verified Finish</text>
  </g>

  <!-- Quality Stamp Floating Bottom Right -->
  <g transform="translate(560, 480)" filter="url(#medalShadow)">
    <rect width="160" height="64" rx="16" fill="#0f172a" stroke="#d97706" stroke-width="1.8" />
    <circle cx="32" cy="32" r="16" fill="#f59e0b" opacity="0.2" />
    <text x="32" y="37" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">★</text>
    <text x="58" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">HEAVY METAL</text>
    <text x="58" y="46" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">3D Die-Cast Brass</text>
  </g>
</svg>
