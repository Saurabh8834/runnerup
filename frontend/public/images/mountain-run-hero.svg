<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Cinematic Sky Gradient -->
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="30%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#1c2541" />
      <stop offset="85%" stop-color="#3a506b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Sun & Horizon Glow -->
    <radialGradient id="heroSun" cx="65%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Layer Gradients -->
    <linearGradient id="backPeaks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <linearGradient id="midPeaks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="forePeaks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="goldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="600" fill="url(#heroSky)" />

  <!-- Stars & Constellations -->
  <g opacity="0.65">
    <circle cx="120" cy="60" r="1.5" fill="#fff" />
    <circle cx="280" cy="40" r="1.2" fill="#fff" />
    <circle cx="450" cy="80" r="1.8" fill="#38bdf8" />
    <circle cx="580" cy="35" r="1" fill="#fff" />
    <circle cx="820" cy="55" r="2" fill="#fbbf24" />
    <circle cx="980" cy="45" r="1.5" fill="#fff" />
    <circle cx="1100" cy="70" r="1.2" fill="#fff" />
    <circle cx="200" cy="110" r="1" fill="#fff" />
    <circle cx="720" cy="95" r="1.4" fill="#a7f3d0" />
  </g>

  <!-- Golden Sunrise Aura Rising Over Mountain Ridge -->
  <circle cx="780" cy="330" r="280" fill="url(#heroSun)" filter="url(#heroGlow)" />
  <circle cx="780" cy="310" r="70" fill="#fffbeb" opacity="0.95" filter="url(#heroGlow)" />

  <!-- Alpine Mountain Layer 1 (Distant Jagged Peaks with Snow Glaciers) -->
  <polygon points="0,380 140,260 260,330 420,210 560,300 700,180 840,280 980,190 1100,270 1200,220 1200,600 0,600" fill="url(#backPeaks)" opacity="0.8" />
  
  <!-- Snowcaps on Peak 420,210 -->
  <polygon points="420,210 395,250 412,255 422,240 435,260 450,248" fill="#e2e8f0" opacity="0.85" />
  <!-- Snowcaps on Peak 700,180 -->
  <polygon points="700,180 670,230 690,238 702,222 718,245 735,225" fill="#f8fafc" opacity="0.95" />
  <!-- Snowcaps on Peak 980,190 -->
  <polygon points="980,190 955,235 972,242 985,228 1000,248 1015,232" fill="#e2e8f0" opacity="0.85" />

  <!-- Mountain Layer 2 (Mid-ground Ridge Line with Sharp Crests) -->
  <polygon points="0,440 180,340 340,400 520,310 680,380 860,290 1020,360 1200,310 1200,600 0,600" fill="url(#midPeaks)" />
  <polyline points="0,440 180,340 340,400 520,310 680,380 860,290 1020,360 1200,310" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />

  <!-- Topographic Elevation Ribbons -->
  <g opacity="0.3" stroke="#06b6d4" stroke-width="1.2" fill="none">
    <path d="M -50,470 Q 300,380 600,430 T 1250,400" />
    <path d="M -50,510 Q 320,420 650,470 T 1250,440" />
    <path d="M -50,550 Q 350,460 700,510 T 1250,480" />
  </g>

  <!-- Foreground Mountain Summit & Trailhead -->
  <polygon points="0,520 220,440 450,490 620,420 820,480 1040,430 1200,500 1200,600 0,600" fill="url(#forePeaks)" />

  <!-- High-Luminance GPS Trail Route Cutting Across the Mountains -->
  <g filter="url(#heroGlow)">
    <path d="M 80,570 Q 240,490 420,510 T 620,420 T 820,470 T 1060,450 T 1160,490" fill="none" stroke="url(#goldNeon)" stroke-width="5" stroke-linecap="round" />
    <path d="M 80,570 Q 240,490 420,510 T 620,420 T 820,470 T 1060,450 T 1160,490" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Checkpoint Waypoints Along GPS Route -->
  <g transform="translate(420, 510)">
    <circle cx="0" cy="0" r="5" fill="#10b981" stroke="#fff" stroke-width="2" filter="url(#heroGlow)" />
  </g>

  <g transform="translate(620, 420)">
    <!-- Summit Flag / Beacon -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <polygon points="0,-32 20,-24 0,-16" fill="#f59e0b" filter="url(#heroGlow)" />
    <circle cx="0" cy="0" r="7" fill="#fbbf24" stroke="#fff" stroke-width="2" filter="url(#heroGlow)" />
    
    <!-- Runner at Summit Flag -->
    <g transform="translate(-16, -10) scale(0.7)">
      <circle cx="0" cy="-45" r="7" fill="#ffffff" />
      <path d="M -8,-36 L 8,-36 L 5,-10 L -5,-10 Z" fill="#ffffff" />
      <path d="M -8,-34 L -22,-52 L -17,-54 L -4,-34" fill="#ffffff" />
      <path d="M 8,-34 L 22,-52 L 17,-54 L 4,-34" fill="#ffffff" />
      <path d="M -5,-10 L -12,12 L -6,14 L 0,-10" fill="#ffffff" />
      <path d="M 5,-10 L 12,12 L 18,10 L 0,-10" fill="#ffffff" />
    </g>
  </g>

  <g transform="translate(820, 470)">
    <circle cx="0" cy="0" r="5" fill="#06b6d4" stroke="#fff" stroke-width="2" filter="url(#heroGlow)" />
  </g>

  <g transform="translate(1060, 450)">
    <circle cx="0" cy="0" r="5" fill="#a855f7" stroke="#fff" stroke-width="2" filter="url(#heroGlow)" />
  </g>

  <!-- Floating HUD Glass Cards -->
  <!-- Left Telemetry -->
  <g transform="translate(60, 60)" filter="url(#heroGlow)">
    <rect width="220" height="68" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="34" r="14" fill="#10b981" fill-opacity="0.2" />
    <path d="M 24,34 L 29,39 L 36,28" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <text x="56" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800">RUNNERUP</text>
    <text x="56" y="48" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">VIRTUAL RACING</text>
  </g>

  <!-- Right Telemetry -->
  <g transform="translate(920, 60)" filter="url(#heroGlow)">
    <rect width="220" height="68" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">PAN-INDIA CHALLENGES</text>
    <text x="30" y="50" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="900">VERIFIED FINISHES</text>
  </g>
</svg>
