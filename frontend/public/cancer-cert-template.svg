<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 682" width="1024" height="682">
  <defs>
    <linearGradient id="certBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="50%" stop-color="#090E1F"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>
    <linearGradient id="certGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="35%" stop-color="#F5D061"/>
      <stop offset="70%" stop-color="#CA9C2F"/>
      <stop offset="100%" stop-color="#8F620A"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF099"/>
      <stop offset="50%" stop-color="#CA9C2F"/>
      <stop offset="75%" stop-color="#FFF099"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="certGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="682" rx="16" fill="url(#certBgGrad)"/>

  <!-- Ornate Dual Border -->
  <rect x="24" y="24" width="976" height="634" rx="12" fill="none" stroke="url(#goldBorderGrad)" stroke-width="4"/>
  <rect x="34" y="34" width="956" height="614" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Corner Flourishes -->
  <g fill="#D4AF37" opacity="0.85">
    <!-- Top-Left -->
    <path d="M28 28 L64 28 C56 36 36 56 28 64 Z"/>
    <!-- Top-Right -->
    <path d="M996 28 L960 28 C968 36 988 56 996 64 Z"/>
    <!-- Bottom-Left -->
    <path d="M28 654 L64 654 C56 646 36 626 28 618 Z"/>
    <!-- Bottom-Right -->
    <path d="M996 654 L960 654 C968 646 988 626 996 618 Z"/>
  </g>

  <!-- Watermark Ribbon in center -->
  <text x="512" y="390" font-size="200" opacity="0.04" text-anchor="middle" fill="#ec4899">🎗️</text>

  <!-- Header Category -->
  <text x="512" y="90" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#FDE047" text-anchor="middle" letter-spacing="4">RUNNERUP SPORTS • OFFICIAL RECOGNITION</text>
  <text x="512" y="125" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#E9D5FF" text-anchor="middle" letter-spacing="3">NATIONAL CANCER AWARENESS DAY VIRTUAL CHALLENGE 2026</text>

  <!-- Gold Divider Line -->
  <line x1="362" y1="145" x2="662" y2="145" stroke="url(#goldBorderGrad)" stroke-width="2"/>

  <!-- Main Title -->
  <text x="512" y="195" font-family="Georgia, serif" font-weight="900" font-size="36" fill="url(#certGoldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#certGlow)">CERTIFICATE OF TRIUMPH</text>
  <text x="512" y="235" font-family="Georgia, serif" font-weight="600" font-size="13" fill="#CBD5E1" text-anchor="middle" letter-spacing="3">THIS IS PROUDLY CONFERRED UPON</text>

  <!-- Athlete Name -->
  <text x="512" y="315" font-family="Georgia, serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAURABH SINGH</text>
  <line x1="382" y1="335" x2="642" y2="335" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>

  <!-- Citation Narrative -->
  <text x="512" y="375" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#94A3B8" text-anchor="middle">for demonstrating courage, resilience, and unyielding spirit in conquering the</text>
  <text x="512" y="415" font-family="Georgia, serif" font-weight="900" font-size="20" fill="#FDE047" text-anchor="middle" letter-spacing="3">5 KM CHALLENGE</text>
  <text x="512" y="450" font-family="Arial, sans-serif" font-weight="400" font-size="14" fill="#94A3B8" text-anchor="middle">standing in solidarity with cancer warriors, fighters, and survivors across India.</text>

  <!-- Footer Divider -->
  <line x1="80" y1="520" x2="944" y2="520" stroke="#334155" stroke-width="1.5"/>

  <!-- Footer Left: Verification Details -->
  <text x="80" y="565" font-family="Courier, monospace" font-weight="700" font-size="13" fill="#C084FC">BIB: NCAD-1999</text>
  <text x="80" y="590" font-family="Courier, monospace" font-size="11" fill="#94A3B8">VERIFY: runnerup.in/verify</text>
  <text x="80" y="612" font-family="Arial, sans-serif" font-size="11" fill="#64748B">DATES: 07–17 NOV 2026</text>

  <!-- Footer Center: 3D Gold Ribbon Seal -->
  <circle cx="512" cy="570" r="38" fill="url(#certGoldGrad)" stroke="#FEF08A" stroke-width="2"/>
  <circle cx="512" cy="570" r="32" fill="#04060E"/>
  <text x="512" y="564" font-family="Georgia, serif" font-weight="900" font-size="8" fill="#FDE047" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
  <text x="512" y="578" font-family="Georgia, serif" font-weight="900" font-size="8" fill="#FDE047" text-anchor="middle" letter-spacing="1">FINISHER</text>
  <text x="512" y="590" font-size="11" text-anchor="middle">🎗️</text>

  <!-- Footer Right: Signature -->
  <text x="944" y="565" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="20" fill="#F5D061" text-anchor="end">Saurabh Singh</text>
  <line x1="820" y1="575" x2="944" y2="575" stroke="#64748B" stroke-width="1"/>
  <text x="944" y="592" font-family="Georgia, serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="end" letter-spacing="2">RACE DIRECTOR</text>
  <text x="944" y="608" font-family="Arial, sans-serif" font-size="10" fill="#C084FC" text-anchor="end">RUNNERUP INDIA</text>
</svg>
